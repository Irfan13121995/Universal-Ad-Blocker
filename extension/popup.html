<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d11;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .shield-icon {
      width: 24px;
      height: 24px;
      fill: #ff3b30;
    }
    h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
      margin: 0 0 14px 0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(52, 199, 89, 0.15);
      color: #34c759;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #34c759;
      border-radius: 50%;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      text-align: center;
      text-decoration: none;
      background: #0a84ff;
      color: white;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="shield-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <h2>Sinkhole YouTube Shield</h2>
  </div>
  <div class="status-badge">
    <span class="dot"></span> Active & Protecting
  </div>
  <p>In-stream video ads, banners, and promotions are stripped in real-time.</p>
  <a class="btn" href="http://127.0.0.1:3002" target="_blank">Open Sinkhole Dashboard</a>
</body>
</html>
